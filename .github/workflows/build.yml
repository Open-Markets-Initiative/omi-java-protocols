name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      # Runs each protocol's round-trip. Capture tests skip unless OMI_PACKETS_DIR names a packet corpus checkout.
      - name: Build
        run: gradle build
